# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    fail_timeout = 2000
    fractional_scaling = 2
}

# Authentication
auth {
    pam {
        enabled = true
        module = hyprlock
    }

    fingerprint {
        enabled = false
    }
}

# Background
background {
    monitor =
    color = rgba(17, 17, 27, 1.0)
}

# User name
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 28
    font_family = JetBrains Mono

    position = 0, 120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = JetBrains Mono

    position = 0, 40
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(180, 180, 190, 1.0)
    font_size = 20
    font_family = JetBrains Mono

    position = 0, -40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =

    size = 300, 60

    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgba(205, 214, 244, 1.0)

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <i>Enter password...</i>

    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    fail_text = <i>$FAIL</i>

    rounding = 15

    position = 0, -140
    halign = center
    valign = center
}
